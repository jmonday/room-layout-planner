<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Layout">
<meta name="theme-color" content="#2f6fde">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Layout Planner</title>
<style>
  :root {
    --bg: #f3f2ee; --panel: #ffffff; --ink: #1d2330; --muted: #6b7280; --line: #e3e1da;
    --accent: #2f6fde; --accent-ink: #ffffff; --danger: #c93c3c; --warn: #d98a1c;
    --floor: #fbfaf6; --wall: #3b3f47; --grid: #ebe8df; --grid5: #d6d2c6; --window: #bcd8f2;
    --input: #fafaf8; --hover: #f1f0ec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --panel: #1e2128; --ink: #e7e9ee; --muted: #9aa1ad; --line: #2e323b;
      --accent: #6b9cff; --accent-ink: #0d1220; --danger: #ef6b6b; --warn: #f0a540;
      --floor: #262a32; --wall: #8a909c; --grid: #2d313a; --grid5: #3b404a; --window: #5a7fa6;
      --input: #181b21; --hover: #272b33;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }
  button, .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  button:hover, .btn:hover { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.confirming { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.sm { padding: 2px 8px; font-size: 12px; }
  input[type=text], select { background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; min-width: 0; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=color] { width: 100%; height: 30px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); }

  .topbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; margin-right: 8px; }
  .topbar select { width: auto; max-width: 220px; }
  .topbar .spacer { flex: 1; }
  .topbar label.inline { display: flex; align-items: center; gap: 6px; color: var(--muted); }

  main { flex: 1; display: grid; grid-template-columns: 290px minmax(0, 1fr) 320px; min-height: 0; }
  aside { overflow: auto; background: var(--panel); min-height: 0; }
  #left { border-right: 1px solid var(--line); }
  #right { border-left: 1px solid var(--line); }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none;
            -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #statusbar { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
               display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .panel { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .field { display: block; margin-bottom: 8px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .check { display: flex; gap: 6px; align-items: center; margin: 4px 0 8px; font-size: 13px; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
  ul.list li:hover { background: var(--hover); }
  ul.list li.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.2); }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .flag-bad { color: var(--danger); font-weight: 700; }
  .flag-warn { color: var(--warn); font-weight: 700; }
  .empty { color: var(--muted); font-size: 13px; }

  .rotrow { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .rotrow .meta { flex: 1 1 100%; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .sw { width: 22px; height: 22px; padding: 0; border-radius: 5px; border: 1px solid rgba(0,0,0,.2); }
  .sw.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatches input[type=color] { width: 36px; height: 24px; }

  .varstatus { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .varstatus b { color: var(--ink); }
  .saverow { display: flex; gap: 6px; margin-bottom: 10px; }
  .vcard { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .vcard.base { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .vcard .thumb { display: block; width: 100%; height: 110px; cursor: pointer; border-radius: 4px; background: var(--bg); }
  .vcard .vhead { display: flex; gap: 6px; align-items: baseline; margin: 6px 0 4px; }
  .vcard .vname { font-weight: 600; }
  .vcard, .gcard { position: relative; }
  .vcard[draggable=true], .gcard[draggable=true] { cursor: grab; }
  .grip { color: var(--muted); cursor: grab; user-select: none; letter-spacing: -2px; }
  .dragsrc { opacity: .4; }
  .drop-before::before, .drop-after::before { content: ''; position: absolute; background: var(--accent); border-radius: 2px; pointer-events: none; }
  .vcard.drop-before::before { left: 0; right: 0; top: -6px; height: 3px; }
  .vcard.drop-after::before { left: 0; right: 0; bottom: -6px; height: 3px; }
  .gcard.drop-before::before { top: 0; bottom: 0; left: -9px; width: 4px; }
  .gcard.drop-after::before { top: 0; bottom: 0; right: -9px; width: 4px; }
  .issues li { font-size: 13px; padding: 3px 0; }
  details.help summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  details.help table { font-size: 12px; margin-top: 8px; border-collapse: collapse; }
  details.help td { padding: 2px 8px 2px 0; vertical-align: top; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--input); }

  #gallery { position: absolute; inset: 0; background: var(--bg); overflow: auto; padding: 16px; z-index: 5; }
  #gallery .ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #gallery .ghead h2 { margin: 0; font-size: 16px; flex: 1; }
  #gallery .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .gcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; }
  .gcard:hover { border-color: var(--accent); }
  .gcard.base { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .gcard svg { width: 100%; height: 220px; display: block; }
  .gcard .gname { font-weight: 600; margin-top: 6px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel);
           padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SVG */
  #canvas *, .thumb *, .gcard svg * { vector-effect: non-scaling-stroke; }
  .s-wall { fill: var(--wall); }
  .s-floor, .s-gap { fill: var(--floor); }
  .s-grid { stroke: var(--grid); stroke-width: 1; fill: none; }
  .s-grid5 { stroke: var(--grid5); stroke-width: 1; fill: none; }
  .s-roomlbl { fill: var(--muted); }
  .item { cursor: grab; }
  body.dragging, body.dragging .item { cursor: grabbing; }
  .item .body { stroke: rgba(0,0,0,.4); stroke-width: 1; }
  .item.floor .body { fill-opacity: .45; stroke-dasharray: 6 4; }
  .item.sel .body { stroke: var(--accent); stroke-width: 2.5; }
  .item.warn .body { stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 5 3; }
  .item.bad .body { stroke: var(--danger); stroke-width: 2.5; stroke-dasharray: 3 3; }
  .item .front { stroke: rgba(0,0,0,.55); stroke-width: 3; stroke-linecap: round; }
  .item text { fill: #1d2330; pointer-events: none; }
  .item.floor text { fill: var(--ink); }
  .s-leaf { stroke: var(--ink); stroke-width: 2; }
  .s-arc { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  .s-zone { fill: var(--accent); fill-opacity: .06; }
  .s-window { fill: var(--window); stroke: var(--ink); stroke-width: 1; }
  .s-slide { fill: var(--panel); stroke: var(--ink); stroke-width: 1; }
  .s-winline { stroke: var(--ink); stroke-width: 1; }
  .ophit { fill: transparent; cursor: ew-resize; }
  .ophit.v { cursor: ns-resize; }
  .ophit.sel { fill: var(--accent); fill-opacity: .25; stroke: var(--accent); stroke-width: 1.5; }
  .s-dim { stroke: var(--accent); stroke-width: 1.25; }
  .s-dimbg { fill: var(--panel); fill-opacity: .92; }
  .s-dimt { fill: var(--accent); font-weight: 600; }
  .s-dim, .s-dimbg, .s-dimt, .s-roomlbl, .s-zone, .s-arc, .s-leaf { pointer-events: none; }

  .banner { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); }
  .banner span { flex: 1; min-width: 200px; }
  .banner[hidden] { display: none; }
  .banner button { background: var(--panel); color: var(--ink); border-color: transparent; }
  .banner button:hover { background: var(--hover); }

  @media (max-width: 1280px) and (min-width: 961px) {
    main { grid-template-columns: 240px minmax(0, 1fr) 270px; }
  }
  @media (pointer: coarse) {
    button, .btn { padding: 8px 12px; }
    button.sm { padding: 5px 10px; }
  }
  @media (max-width: 960px) {
    html, body { height: auto; }
    main { grid-template-columns: 1fr; }
    #stage { height: 62vh; order: -1; border-bottom: 1px solid var(--line); }
    #left, #right { border: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Layout Planner</span>
  <select id="roomSelect" aria-label="Room"></select>
  <button data-a="newRoom">+ Room</button>
  <span class="spacer"></span>
  <button data-a="undo" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">Undo</button>
  <button data-a="redo" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
  <label class="inline">Snap
    <select id="snapSelect">
      <option value="0.5">½"</option><option value="1">1"</option><option value="2">2"</option>
      <option value="3">3"</option><option value="6">6"</option><option value="12">1'</option>
    </select>
  </label>
  <button data-a="gallery">Compare variations</button>
  <button data-a="exportImage" title="Save the current layout as a PNG with dimensions">Save image</button>
  <button data-a="share" title="Share the current room (with its variations) as a link">Share room</button>
  <button data-a="export" title="Download all rooms and variations as JSON">Export data</button>
  <label class="btn" title="Load a previously exported JSON file">Import data<input type="file" id="importFile" accept="application/json,.json" hidden></label>
</header>
<div id="banner" class="banner" hidden></div>
<main>
  <aside id="left"></aside>
  <section id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="statusbar"></div>
    <div id="gallery" hidden></div>
  </section>
  <aside id="right"></aside>
</main>
<div id="toast" role="status"></div>

<script>
'use strict';

/* ---------- constants ---------- */
const LS_STATE = 'layoutPlanner.state.v1';
const LS_PREFS = 'layoutPlanner.prefs.v1';
const WALL = 5;          // wall thickness, inches
const EPS = 1e-6;
const PALETTE = ['#a5c8ff', '#ffc6a5', '#b8e0c2', '#f3b6d0', '#d7c6ff', '#ffe39a', '#a9e3e3', '#e6cfa8', '#c9d6a3', '#f5b3a8'];
const PRESETS = [
  { name: 'Queen bed', w: 60, d: 80 }, { name: 'King bed', w: 76, d: 80 }, { name: 'Full bed', w: 54, d: 75 },
  { name: 'Twin bed', w: 38, d: 75 }, { name: 'Nightstand', w: 22, d: 16 }, { name: 'Dresser', w: 60, d: 20 },
  { name: 'Wardrobe', w: 48, d: 24 }, { name: 'Sofa (3-seat)', w: 84, d: 36 }, { name: 'Loveseat', w: 60, d: 36 },
  { name: 'Sectional', w: 110, d: 84 }, { name: 'Armchair', w: 32, d: 34 }, { name: 'Coffee table', w: 48, d: 24 },
  { name: 'Side table', w: 20, d: 20 }, { name: 'TV stand', w: 60, d: 18 }, { name: 'Desk', w: 60, d: 30 },
  { name: 'Office chair', w: 26, d: 26 }, { name: 'Dining table (6)', w: 72, d: 36 }, { name: 'Round table 48"', w: 48, d: 48, shape: 'round' },
  { name: 'Dining chair', w: 18, d: 20 }, { name: 'Bookshelf', w: 36, d: 12 }, { name: 'Piano (upright)', w: 58, d: 24 },
  { name: 'Area rug 5×8', w: 96, d: 60, floor: true }, { name: 'Area rug 8×10', w: 120, d: 96, floor: true },
  { name: 'Runner rug 2.5×8', w: 96, d: 30, floor: true }, { name: 'Round rug 6\'', w: 72, d: 72, floor: true, shape: 'round' },
  { name: 'Round side table', w: 20, d: 20, shape: 'round' }, { name: 'Oval coffee table', w: 48, d: 28, shape: 'round' },
  { name: 'Round ottoman', w: 24, d: 24, shape: 'round' }, { name: 'Bistro table', w: 30, d: 30, shape: 'round' },
];
const WALL_NAMES = { N: 'Top wall', S: 'Bottom wall', W: 'Left wall', E: 'Right wall' };
const OPENING_DEFAULTS = { door: 32, sliding: 72, window: 36, opening: 36 };
const OPENING_NAMES = { door: 'Door', sliding: 'Sliding door', window: 'Window', opening: 'Open doorway' };
const TOL = 0.02;        // allowed interpenetration (inches) when testing collisions

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = v => Math.round(v * 100) / 100;
const normAngle = a => r2(((a % 360) + 360) % 360) % 360;

function fmt(inches) { // feet + inches
  const neg = inches < 0;
  let v = Math.round(Math.abs(inches) * 2) / 2;
  let ft = Math.floor(v / 12), inch = Math.round((v - ft * 12) * 2) / 2;
  if (inch >= 12) { ft++; inch -= 12; }
  const is = Number.isInteger(inch) ? String(inch) : inch.toFixed(1);
  const s = ft ? (inch ? `${ft}' ${is}"` : `${ft}'`) : `${is}"`;
  return (neg ? '-' : '') + s;
}
function fmtIn(inches) { // inches only
  const v = Math.round(inches * 2) / 2;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + '"';
}
function parseLen(str, def = 'in') {
  let s = String(str).trim().toLowerCase().replace(/[’′‘]/g, "'").replace(/[”″“]/g, '"').replace(/''/g, '"');
  if (!s) return null;
  const N = '(\\d+(?:\\.\\d+)?|\\.\\d+)';
  let m;
  if ((m = s.match(new RegExp(`^${N}\\s*(?:'|ft|feet|foot)\\s*(?:${N}\\s*(?:"|in|inch|inches)?)?$`)))) return +m[1] * 12 + (m[2] ? +m[2] : 0);
  if ((m = s.match(new RegExp(`^${N}\\s*(?:"|in|inch|inches)$`)))) return +m[1];
  if ((m = s.match(new RegExp(`^${N}\\s*cm$`)))) return +m[1] / 2.54;
  if ((m = s.match(new RegExp(`^${N}\\s*m$`)))) return +m[1] * 100 / 2.54;
  if ((m = s.match(new RegExp(`^${N}\\s+${N}$`)))) return +m[1] * 12 + +m[2];
  if ((m = s.match(new RegExp(`^${N}$`)))) return def === 'ft' ? +m[1] * 12 : +m[1];
  return null;
}

/* ---------- state ---------- */
function makeRoom(name, w, d) {
  return {
    id: uid(), name, w, d,
    openings: [{ id: uid(), type: 'door', wall: 'S', offset: 12, width: 32, hinge: 'start', swing: 'in' }],
    items: [], variations: [], baseVarId: null,
  };
}
function defaultState() {
  const r = makeRoom('Living room', 168, 144);
  return { rooms: [r], activeId: r.id };
}
function normalize(data) {
  if (!data || !Array.isArray(data.rooms) || !data.rooms.length) throw new Error('No rooms found in file');
  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  const normItem = (it, i) => ({
    id: String(it.id || uid()), name: String(it.name || 'Item'), w: Math.max(1, num(it.w, 24)), d: Math.max(1, num(it.d, 24)),
    x: num(it.x, 0), y: num(it.y, 0), rot: normAngle(num(it.rot, 0)),
    color: /^#[0-9a-f]{6}$/i.test(it.color) ? it.color : PALETTE[i % PALETTE.length], floor: !!it.floor,
    shape: it.shape === 'round' ? 'round' : 'rect',
  });
  const rooms = data.rooms.map(r => ({
    id: String(r.id || uid()), name: String(r.name || 'Room'), w: Math.max(12, num(r.w, 144)), d: Math.max(12, num(r.d, 144)),
    openings: (r.openings || []).map(o => ({
      id: String(o.id || uid()), type: OPENING_NAMES[o.type] ? o.type : 'door', panels: [2, 3, 4].includes(o.panels) ? o.panels : 2,
      wall: ['N', 'S', 'E', 'W'].includes(o.wall) ? o.wall : 'N', offset: Math.max(0, num(o.offset, 0)),
      width: Math.max(6, num(o.width, 32)), hinge: o.hinge === 'end' ? 'end' : 'start', swing: o.swing === 'out' ? 'out' : 'in',
    })),
    items: (r.items || []).map(normItem),
    variations: (r.variations || []).map(v => ({
      id: String(v.id || uid()), name: String(v.name || 'Variation'), savedAt: num(v.savedAt, Date.now()), items: (v.items || []).map(normItem),
    })),
    baseVarId: r.baseVarId || null,
  }));
  const activeId = rooms.some(r => r.id === data.activeId) ? data.activeId : rooms[0].id;
  return { rooms, activeId };
}
function loadState() {
  try { const raw = localStorage.getItem(LS_STATE); if (raw) return normalize(JSON.parse(raw)); } catch (e) { console.warn(e); }
  return defaultState();
}
function loadPrefs() {
  try { return Object.assign({ snap: 1 }, JSON.parse(localStorage.getItem(LS_PREFS) || '{}')); } catch { return { snap: 1 }; }
}
let state = loadState();
let prefs = loadPrefs();
function save() {
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); localStorage.setItem(LS_PREFS, JSON.stringify(prefs)); }
  catch (e) { toast('Could not save to browser storage: ' + e.message); }
}

// UI-only state
let sel = null;            // {kind:'item'|'opening', id}
let drag = null;
let ui = { confirm: null, renamingVar: null, gallery: false };
let draft = { preset: '', name: '', w: '', d: '', floor: false, shape: 'rect', varName: '', moveTarget: '' };
let viewK = 3;
let varDrag = null;       // {id} while a variation card is being dragged             // screen px per inch on the main canvas

const cur = () => state.rooms.find(r => r.id === state.activeId) || state.rooms[0];
const selItem = () => sel && sel.kind === 'item' ? cur().items.find(i => i.id === sel.id) : null;
const selOpening = () => sel && sel.kind === 'opening' ? cur().openings.find(o => o.id === sel.id) : null;

/* ---------- history ---------- */
const undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify(state);
function commit(before) {
  if (before === snapshot()) return;
  undoStack.push(before);
  if (undoStack.length > 200) undoStack.shift();
  redoStack.length = 0;
  save();
}
function mutate(fn) {
  const before = snapshot();
  const res = fn();
  commit(before);
  render();
  return res;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot()); state = JSON.parse(undoStack.pop()); save(); render();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot()); state = JSON.parse(redoStack.pop()); save(); render();
}

/* ---------- geometry ---------- */
// Items are stored by the top-left corner (x, y) of their axis-aligned bounding box plus an angle (rot, degrees clockwise).

      const b = rectOf(o);
      xs.push(b.x - f.w, b.x + b.w, b.x, b.x + b.w - f.w);
      ys.push(b.y - f.h, b.y + b.h, b.y, b.y + b.h - f.h);
    }
    const tx = snapMagnet(drag.start.x + dx, step, xs, free), ty = snapMagnet(drag.start.y + dy, step, ys, free);
    slideTo(room, it, tx, ty);
  } else {
    const op = room.openings.find(o => o.id === drag.id);
    if (!op) return;
    const horiz = op.wall === 'N' || op.wall === 'S', len = wallLen(room, op.wall);
    const raw = drag.start + (horiz ? dx : dy);
    op.offset = r2(clamp(snapMagnet(raw, step, [0, len - op.width], free), 0, len - op.width));
  }
  render();
});
function endDrag() {
  if (!drag) return;
  if (drag.moved) commit(drag.before);
  drag = null;
  document.body.classList.remove('dragging');
  render();
}
svgEl.addEventListener('pointerup', endDrag);
svgEl.addEventListener('pointercancel', endDrag);

/* variation reordering (HTML5 drag and drop on sidebar + compare cards) */
function clearDropMarks() {
  document.querySelectorAll('.drop-before, .drop-after, .dragsrc').forEach(el => el.classList.remove('drop-before', 'drop-after', 'dragsrc'));
}
function dropSide(card, e) {
  const r = card.getBoundingClientRect();
  return card.classList.contains('gcard') ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
}
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('[data-var]');
  if (!card || card.getAttribute('draggable') !== 'true') return;
  varDrag = { id: card.dataset.var };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', card.dataset.var);
  card.classList.add('dragsrc');
});
document.addEventListener('dragover', e => {
  if (!varDrag) return;
  const card = e.target.closest && e.target.closest('[data-var]');
  if (!card) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const after = dropSide(card, e);
  document.querySelectorAll('.drop-before, .drop-after').forEach(el => { if (el !== card) el.classList.remove('drop-before', 'drop-after'); });
  if (card.dataset.var !== varDrag.id) { card.classList.toggle('drop-after', after); card.classList.toggle('drop-before', !after); }
});
document.addEventListener('drop', e => {
  if (!varDrag) return;
  const card = e.target.closest && e.target.closest('[data-var]');
  e.preventDefault();
  const id = varDrag.id;
  varDrag = null;
  clearDropMarks();
  if (card) { const after = dropSide(card, e); mutate(() => moveVariation(cur(), id, card.dataset.var, after)); }
  render();
});
document.addEventListener('dragend', () => {
  if (!varDrag) return;
  varDrag = null;
  clearDropMarks();
  render();
});

new ResizeObserver(() => render()).observe($('#stage'));
render();
readShareHash();
window.addEventListener('hashchange', readShareHash);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
